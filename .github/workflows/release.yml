name: Release

# Builds a ready-to-run Network-ATC for Windows x64 (self-contained, no .NET install needed).
#  - Every push to main, pull request and manual run: the package is attached to the run as an artifact.
#  - Every run also builds the installer Network-ATC-Setup-<version>.exe (Inno Setup, installer/Network-ATC.iss).
#  - Tags v*: the installer and the zip are published as a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/NetworkAtc.Core.Tests -c Release

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v'); $name = "Network-ATC-$v-win-x64"
          } else {
            $v = '0.1.0'; $name = "Network-ATC-$v-build${{ github.run_number }}-win-x64"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/NetworkAtc.App -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} -o publish/Network-ATC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build examples/SamplePlugin -c Release
          New-Item -ItemType Directory -Force publish/Network-ATC/plugin-examples | Out-Null
          Copy-Item examples/SamplePlugin/bin/Release/net8.0/SamplePlugin.dll publish/Network-ATC/plugin-examples/
          Copy-Item src/NetworkAtc.PluginApi/bin/Release/net8.0/NetworkAtc.PluginApi.xml publish/Network-ATC/ -ErrorAction SilentlyContinue
          if (-not (Test-Path publish/Network-ATC/Network-ATC.exe)) { throw "Network-ATC.exe missing" }
          # EuroScope plugins run in a 32-bit host next to the program (esbridge folder).
          cmake -S native/EsBridge -B build/esbridge -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/esbridge --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force publish/Network-ATC/esbridge | Out-Null
          Copy-Item build/esbridge/Release/EuroScopePlugInDll.dll, build/esbridge/Release/NetworkAtc.EsHost.exe publish/Network-ATC/esbridge/
          Compress-Archive -Path publish/Network-ATC -DestinationPath "${{ steps.version.outputs.name }}.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\publish\Network-ATC" "/DOutputDir=$PWD\dist" installer\Network-ATC.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\Network-ATC-Setup-${{ steps.version.outputs.version }}.exe")) { throw "installer missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: publish/Network-ATC

      - uses: actions/upload-artifact@v4
        with:
          name: Network-ATC-Setup-${{ steps.version.outputs.version }}
          path: dist/Network-ATC-Setup-${{ steps.version.outputs.version }}.exe

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Network-ATC-Setup-${{ steps.version.outputs.version }}.exe
            ${{ steps.version.outputs.name }}.zip
          generate_release_notes: true
